[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-otp-number"
version = "1.0.0"
description = "Production Telegram OTP marketplace bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "greenlet>=3,<4",
  "aiosqlite>=0.20,<1",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "croniter>=6,<7"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
